<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1329">
<link rel="manifest" href="manifest.json">
<title>Ativamente - Jogos Educativos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #00e676;
    --primary-hover: #00c853;
    --bg-dark: #0b1329;
    --bg-card: rgba(23, 32, 54, 0.8);
    --bg-input: #172036;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: rgba(255, 255, 255, 0.08);
    --radius: 14px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    padding-bottom: env(safe-area-inset-bottom);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 1rem 1.2rem;
    position: sticky; top: 0;
    background: rgba(11, 19, 41, 0.95);
    backdrop-filter: blur(10px);
    z-index: 5;
    border-bottom: 1px solid var(--border-color);
  }

  .nav-brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.8rem;
  }

  .brand-logo {
    height: 48px;
    width: auto;
    object-fit: contain;
  }

  #busca {
    width: 100%; 
    padding: .85rem 1.2rem;
    border-radius: var(--radius); 
    border: 1px solid var(--border-color);
    background: var(--bg-input); 
    color: var(--text-main); 
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }

  #busca:focus { 
    border-color: var(--primary); 
    box-shadow: 0 0 0 3px rgba(0, 230, 118, 0.15);
  }

  .hero-mini {
    text-align: center;
    padding: 1.5rem 1rem 0.5rem;
  }

  .hero-mini h2 {
    font-size: 1.5rem;
    font-weight: 800;
    margin: 0 0 0.4rem;
  }

  .hero-mini h2 span { color: var(--primary); }
  .hero-mini p { font-size: 0.9rem; color: var(--text-muted); margin: 0; }

  #lista {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 1rem;
    padding: 1.2rem;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
  }

  .card {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 1.2rem;
    cursor: pointer;
    transition: transform .2s ease, background .2s ease, border-color .2s ease;
    border: 1px solid var(--border-color);
    display: flex; 
    flex-direction: column; 
    gap: .5rem;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
  }

  .card:hover {
    border-color: rgba(0, 230, 118, 0.4);
    transform: translateY(-2px);
  }

  .card:active { transform: scale(.97); background: #1c2742; }
  .card .emoji { font-size: 2.2rem; }
  .card .nome { font-weight: 700; font-size: 1rem; color: var(--text-main); }
  .card .desc { font-size: .8rem; color: var(--text-muted); line-height: 1.35; }
  .vazio { grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem 1rem; }

  #player {
    position: fixed; inset: 0;
    background: var(--bg-dark);
    display: none; flex-direction: column;
    z-index: 100;
  }
  
  #player.aberto { display: flex; }
  
  #player header {
    display: flex; align-items: center; gap: 1rem;
    padding: .8rem 1rem;
    background: #172036;
    border-bottom: 1px solid var(--border-color);
  }

  #voltar {
    background: rgba(255, 255, 255, 0.1); 
    border: 0; 
    color: var(--text-main);
    width: 40px; height: 40px; 
    border-radius: 10px;
    font-size: 1.2rem; 
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  #voltar:active { background: rgba(255, 255, 255, 0.2); }
  #tituloJogo { font-weight: 700; font-size: 1.05rem; }
  #frame { flex: 1; width: 100%; border: 0; background: #fff; }

  footer {
    margin-top: auto;
    text-align: center;
    padding: 1.5rem 1rem;
    border-top: 1px solid var(--border-color);
    color: var(--text-muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<header>
  <div class="nav-brand">
    <!-- Logotipo principal -->
    <img src="logo.png" alt="Ativamente - Jogos Educativos" class="brand-logo">
  </div>
  <input id="busca" type="search" placeholder="Buscar jogo educativo...">
</header>

<main>
  <div class="hero-mini">
    <h2>Desperte seu <span>Potencial</span></h2>
    <p>Escolha um jogo abaixo para começar a treinar a mente!</p>
  </div>

  <div id="lista"></div>
</main>

<footer>
  © 2026 Ativamente - Jogos Educativos
</footer>

<div id="player">
  <header>
    <button id="voltar" aria-label="Voltar">←</button>
    <span id="tituloJogo"></span>
  </header>
  <iframe id="frame" allowfullscreen></iframe>
</div>

<script>
const BASE = window.location.pathname.replace(/\/[^\/]*$/, '/');

const JOGOS = [
  {
    id: 'trava-letras',
    nome: 'Trava Letras',
    emoji: '🔤',
    desc: 'Diga palavras por categoria antes do tempo acabar',
    tags: 'letras palavras categorias multiplayer',
    arquivo: 'trava-letras.html'
  },
  {
    id: 'termo-solo',
    nome: 'Termo Solo',
    emoji: '🟩',
    desc: 'Descubra a palavra de 5 letras',
    tags: 'palavras letras termo wordle',
    arquivo: 'termo-solo.html'
  },
  {
    id: 'termo-duel',
    nome: 'Termo Duel',
    emoji: '⚔️',
    desc: 'Duelo de palavras entre 2 jogadores',
    tags: 'palavras letras termo wordle multiplayer',
    arquivo: 'termo-duel.html'
  },
  {
    id: 'cores-setas',
    nome: 'Cores & Setas',
    emoji: '🌈',
    desc: 'Toque no círculo da cor certa — reflexo e atenção',
    tags: 'cores reflexo atenção velocidade',
    arquivo: 'cores-setas.html'
  },
  {
    id: 'setas-4direcoes',
    nome: 'Setas 4 Direções',
    emoji: '➡️',
    desc: 'Acompanhe a seta por 2 minutos — foco e ritmo',
    tags: 'setas reflexo atenção ritmo',
    arquivo: 'setas-4direcoes.html'
  },
  {
    id: 'genius-square',
    nome: 'Genius Square',
    emoji: '🧩',
    desc: 'Encaixe as 9 peças sem sobrepor os bloqueadores',
    tags: 'puzzle logica tetris raciocinio genius square',
    arquivo: 'genius-square.html'
  }
];

const lista = document.getElementById('lista');
const busca = document.getElementById('busca');
const player = document.getElementById('player');
const frame = document.getElementById('frame');
const tituloJogo = document.getElementById('tituloJogo');

function renderizar(filtro = '') {
  const termo = filtro.toLowerCase().trim();
  const filtrados = JOGOS.filter(j => {
    const alvo = (j.nome + ' ' + j.desc + ' ' + (j.tags || '')).toLowerCase();
    return alvo.includes(termo);
  });

  if (!filtrados.length) {
    lista.innerHTML = '<div class="vazio">Nenhum jogo encontrado 😕</div>';
    return;
  }

  lista.innerHTML = filtrados.map(j => `
    <div class="card" data-id="${j.id}">
      <div class="emoji">${j.emoji}</div>
      <div class="nome">${j.nome}</div>
      <div class="desc">${j.desc}</div>
    </div>
  `).join('');
}

lista.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const jogo = JOGOS.find(j => j.id === card.dataset.id);
  if (!jogo) return;

  tituloJogo.textContent = `${jogo.emoji} ${jogo.nome}`;
  frame.src = BASE + jogo.arquivo;
  player.classList.add('aberto');
});

document.getElementById('voltar').addEventListener('click', () => {
  player.classList.remove('aberto');
  frame.src = '';
});

busca.addEventListener('input', e => renderizar(e.target.value));

renderizar();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log('SW ativo'))
      .catch(err => console.log('SW erro:', err));
  });
}
</script>
</body>
</html>
